# Chrony NTP Client Configuration for Raspberry Pi (192.168.1.10)
# Хакатон «Эвакуация» (Кубок РТК Высшая Лига, Ижевск)
#
# Файл размещается в /etc/chrony/conf.d/ijkbot_client.conf на Raspberry Pi.

# Основной NTP-сервер ноутбука на соревновательной арене (192.168.1.20)
# iburst: отправка серии пакетов при старте для моментального захвата времени
# minpoll 1 maxpoll 2: частый опрос (каждые 2-4 секунды) для удержания |Δt| < 5 мс
server 192.168.1.20 iburst minpoll 1 maxpoll 2 prefer

# Резервный NTP-сервер ноутбука на мобильной точке доступа разработки
server 172.22.35.254 iburst minpoll 1 maxpoll 2

# Быстрая ступенчатая коррекция времени при расхождении > 100 мс в первые 3 обновления
makestep 0.1 3

# Высокая чувствительность к изменению дрейфа часов
maxupdateskew 100.0

# Разрешить удаленный опрос со стороны ноутбука
cmdallow 127.0.0.1
cmdallow 192.168.1.0/24
cmdallow 172.22.35.0/24
