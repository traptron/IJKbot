# Chrony NTP Server Configuration for Laptop (192.168.1.20)
# Хакатон «Эвакуация» (Кубок РТК Высшая Лига, Ижевск)
#
# Файл размещается в /etc/chrony/conf.d/ijkbot_server.conf на ноутбуке.
# Позволяет Raspberry Pi синхронизировать системные часы с ноутбуком
# в изолированной сети полигона без доступа в Интернет.

# Локальный стратум: ноутбук объявляет себя эталонным источником stratum 8
# при отсутствии или потере связи с внешними NTP-серверами.
local stratum 8

# Разрешить запросы времени из соревновательной подсети робота (192.168.1.0/24)
allow 192.168.1.0/24

# Разрешить запросы времени из подсети разработки (172.22.35.0/24)
allow 172.22.35.0/24

# Быстрая ступенчатая коррекция времени при расхождении > 100 мс в первые 3 обновления
makestep 0.1 3

# Разрешить мониторинг через chronyc для доверенной локальной сети
cmdallow 127.0.0.1
cmdallow 192.168.1.0/24
cmdallow 172.22.35.0/24
