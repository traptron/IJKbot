scan_to_scan_filter_chain:
  ros__parameters:
    # ==============================================================================
    # 1. Полное отсечение задней полусферы и корпуса робота (X <= 0.08 м в base_footprint)
    # Сканируем ТОЛЬКО то, что находится впереди робота (X > 0.08 м).
    # Полностью исключает: корпус, шасси, провода, батарею, кастеры, колеса
    # и чирканье задних лучей по полу при наклонах робота во время движения.
    # ==============================================================================
    filter1:
      name: rear_and_robot_body
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_footprint
        min_x: -15.000
        max_x: 0.080
        min_y: -15.000
        max_y: 15.000
        min_z: -1.000
        max_z: 2.000
        invert: false

    # ==============================================================================
    # 2. Левый передний фланг (отсекает боковые лучи под 90°, цепляющие колесо/бампер)
    # ==============================================================================
    filter2:
      name: left_front_flank
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_footprint
        min_x: 0.050
        max_x: 0.220
        min_y: 0.065
        max_y: 1.000
        min_z: -0.100
        max_z: 0.500
        invert: false

    # ==============================================================================
    # 3. Правый передний фланг (отсекает боковые лучи под 90°, цепляющие колесо/бампер)
    # ==============================================================================
    filter3:
      name: right_front_flank
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_footprint
        min_x: 0.050
        max_x: 0.220
        min_y: -1.000
        max_y: -0.065
        min_z: -0.100
        max_z: 0.500
        invert: false

    # ==============================================================================
    # 4. Фильтр паразитных ближних переотражений у корпуса лидара (< 18 см)
    # ==============================================================================
    filter4:
      name: min_range_filter
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.18
        upper_threshold: 10.0
        lower_replacement_value: .nan
        upper_replacement_value: .nan
