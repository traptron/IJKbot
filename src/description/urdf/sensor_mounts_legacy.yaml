# Штатные координаты IJKbot. xyz в метрах, rpy в радианах.
camera:
  # base_link → camera_link. Нулевой pitch соответствует установке параллельно полу.
  xyz: [0.05, 0.0, 0.12]
  rpy: [0.0, 0.0, 0.0]
lidar:
  # base_footprint → lidar_link. Плоскость сканирования на высоте 120 мм.
  # Лидар в штатной сборке установлен вверх ногами.
  xyz: [0.0, 0.0, 0.120]
  rpy: [3.141592653589793, 0.0, 3.141592653589793]
